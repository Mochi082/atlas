<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>社員の声の追加</title>
	<link rel="stylesheet" href="/static/css/management.css">
</head>
<body>
	<main>
{% include "management-messages.html" %}
		<h1>社員の声の追加</h1>
		<form action="{{ url_for('new_comment') }}" method="post">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
			<fieldset>
				<legend>VOiCE 埋め込みタグ</legend>
				<p>
					<label for="embed">VOiCEの「埋め込み」で表示される iframe タグを貼り付けてください</label>
					<textarea id="embed" name="embed" rows="6" required placeholder='<iframe src="https://www.shain-voice.com/corporate/..." ...></iframe>'></textarea>
				</p>
			</fieldset>
			<button type="submit">社員の声を追加</button>
		</form>
		<p><a href="{{ url_for('management') }}">管理画面へ戻る</a></p>
	</main>
</body>
</html>
