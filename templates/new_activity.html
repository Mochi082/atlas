<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活動記事の作成</title>
  <link rel="stylesheet" href="/static/css/management.css">
</head>
<body>
  <main>
{% include "management-messages.html" %}
    <h1>活動記事の作成</h1>

    <form action="{{ url_for('new_activity') }}" method="post" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <p>
        <label for="title">タイトル</label>
        <input id="title" name="title" type="text" required>
      </p>

      {% for number in range(1, 5) %}
      <fieldset data-section{% if number > 1 %} hidden{% endif %}>
        <legend>セクション {{ number }}</legend>
        <p>
          <label for="image{{ number }}">画像 {{ number }}（任意）</label>
          <input id="image{{ number }}" name="image{{ number }}" type="file" accept=".jpg,.jpeg,.png,.gif,.webp">
        </p>
        <p>
          <label for="text{{ number }}">本文 {{ number }}{% if number > 1 %}（任意）{% endif %}</label>
          <textarea id="text{{ number }}" name="text{{ number }}" rows="6"{% if number == 1 %} required{% endif %}></textarea>
        </p>
      </fieldset>
      {% endfor %}

      <button type="button" data-add-section>＋ セクションを追加（最大4つ）</button>

      <button type="submit">活動記事を作成</button>
    </form>

    <p><a href="{{ url_for('management') }}">管理画面へ戻る</a></p>
  </main>

  <script>
    // 隠れているセクションを1つずつ表示する。4つすべて表示したら＋ボタンを隠す
    document.querySelectorAll('[data-add-section]').forEach((button) => {
      const container = button.parentElement;
      const update = () => {
        button.hidden = !container.querySelector(':scope > [data-section][hidden]');
      };
      button.addEventListener('click', () => {
        const next = container.querySelector(':scope > [data-section][hidden]');
        if (next) {
          next.hidden = false;
          next.querySelector('input[type="file"], textarea').focus();
        }
        update();
      });
      update();
    });
  </script>
</body>
</html>
